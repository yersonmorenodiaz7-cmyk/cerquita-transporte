<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CERQUITA · Pago</title>
<style>
:root{--bg:#f4f6f8;--fg:#10181f;--card:#fff;--br:#dfe4e9;--mut:#66727e;--acc:#1769ff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1419;--fg:#eef2f5;--card:#18212a;--br:#2a3541;--mut:#93a0ac}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:420px;margin:14vh auto;padding:0 16px;text-align:center}.logo{font-weight:800;font-size:26px;color:var(--acc);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:24px}
.big{font-size:44px;margin:0}.mut{color:var(--mut);font-size:14px}
button{padding:12px 18px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:10px}
</style></head>
<body><div class="w"><div class="logo">📍 CERQUITA</div><div class="card" id="box"><p class="big">⏳</p><p>Verificando tu pago…</p></div></div>
<script>
const FN='https://bwcluuunbaxpmdpscekg.supabase.co/functions/v1/wompi-verify';
const id=new URLSearchParams(location.search).get('id'),box=document.getElementById('box');
const show=(e,t,s,b)=>{box.innerHTML=`<p class="big">${e}</p><p><b>${t}</b></p><p class="mut">${s}</p>${b?'<button onclick="check()">Verificar de nuevo</button>':''}`};
async function check(tries=0){
  if(!id){show('⚠️','No encontramos tu pago','Abre esta página desde el enlace que te dio Wompi al terminar.');return}
  try{
    const r=await fetch(`${FN}?id=${encodeURIComponent(id)}`),d=await r.json();
    if(d.status==='APPROVED')show('✅','¡Recarga aprobada!','Tu saldo se acredita en unos segundos. Vuelve a la app de CERQUITA.');
    else if(d.status==='PENDING'){ if(tries<6){show('⏳','Tu recarga está en proceso','Lo estamos verificando…');setTimeout(()=>check(tries+1),4000)} else show('⏳','Tu pago sigue en proceso','Cuando el banco lo confirme aparecerá en la app.',true)}
    else if(['DECLINED','ERROR','VOIDED'].includes(d.status))show('❌','El pago no fue aprobado','Vuelve a la app de CERQUITA y toca «Recargar» para intentarlo de nuevo.');
    else if(d.status==='MISMATCH')show('⚠️','El valor pagado no coincide','Escríbenos desde la app para revisar tu caso.');
    else show('⚠️','No pudimos verificar el pago',d.error||'Intenta de nuevo en unos segundos.',true);
  }catch(e){show('⚠️','Sin conexión','Revisa tu internet e intenta de nuevo.',true)}
}
check();
</script></body></html>
