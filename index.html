<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CERQUITA</title>
<style>
:root{--bg:#f4f6f8;--fg:#10181f;--card:#fff;--br:#dfe4e9;--mut:#66727e;--acc:#1769ff;--map:#e6ecf1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1419;--fg:#eef2f5;--card:#18212a;--br:#2a3541;--mut:#93a0ac;--map:#1d2832}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:880px;margin:auto;padding:12px}.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.logo{font-weight:800;font-size:20px;color:var(--acc);margin-right:auto}
.tabs button{padding:8px 12px;border:1px solid var(--br);background:var(--card);color:var(--fg);border-radius:20px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:14px;margin-bottom:10px}
h3{margin:0 0 8px;font-size:16px}.mut{color:var(--mut);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{margin-left:auto}
button.b{padding:12px 16px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.b.g{background:transparent;color:var(--fg);border:1px solid var(--br)}button.b.r{background:#d92d3a}button.b.s{padding:8px 12px}.full{width:100%}
select,input{padding:10px;border:1px solid var(--br);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;min-width:0}
.chip{padding:8px 12px;border-radius:20px;border:1px solid var(--br);background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.price{font-size:28px;font-weight:800;text-align:center;flex:1}.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--br)}
svg.map{width:100%;height:auto;border-radius:14px;background:var(--map);display:block;margin-bottom:10px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border-bottom:1px solid var(--br);text-align:left;white-space:nowrap}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}.k div{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:10px}.k b{font-size:20px;display:block}
.off{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--br)}
#t{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto;background:#10181f;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:9}
</style></head>
<body><div class="w" id="app"></div><div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== Configuración (la llave anon es pública por diseño; la seguridad la dan las políticas RLS) =====
const SUPABASE_URL='https://bwcluuunbaxpmdpscekg.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3Y2x1dXVuYmF4cG1kcHNjZWtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzODM3NDYsImV4cCI6MjEwODk1OTc0Nn0.0Pi0yGf_fHVBjWJJdlkxO6yVvEa1_RBY4-izbsMCDCs';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $c=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const PL={'Parque de Bello':[6.3373,-75.5579],'Niquía':[6.347,-75.54],'Estación Acevedo':[6.299,-75.564],'Parque Berrío':[6.2518,-75.5636],'Estadio':[6.2565,-75.59],'Aeropuerto Olaya Herrera':[6.22,-75.59],'El Poblado':[6.2087,-75.57],'Itagüí centro':[6.172,-75.611]};
const ST={searching:'Buscando ofertas',accepted:'Conductor en camino',arrived:'Tu conductor llegó',ongoing:'En viaje',completed:'Viaje finalizado',cancelled:'Cancelado',expired:'Expirado'};
const STAFF=['operador','supervisor','admin'],ACT=['searching','accepted','arrived','ongoing'];
const COL={p:'#1769ff',d:'#12a150',a:'#6d4aff'};
let S={u:null,p:null,d:null,cfg:null,cats:{},ride:null,offers:[],rides:[],pd:null,loc:null,req:[],mo:[],cur:null,dh:[],a:null,hid:[]};
let ui={role:'p',mode:'in',email:'',pass:'',name:'',o:'Parque de Bello',d:'Parque Berrío',c:'carro',pr:null,pay:'efectivo',rn:'',rc:'carro',rm:'',rp:'',rcol:'',dt:'licencia',tab:'drivers',eta:5};
let pend=false;
function toast(x){const t=document.getElementById('t');t.textContent=x;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4500)}
const q=async p=>{const{data,error}=await p;if(error){toast(error.message);return undefined}return data};
const m=async p=>{const{error}=await p;if(error){toast(error.message);return false}return true};
const hav=(a,b)=>{const t=x=>x*Math.PI/180,h=Math.sin(t(b[0]-a[0])/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(t(b[1]-a[1])/2)**2;return 12742*Math.asin(Math.sqrt(h))};
function calc(){const c=S.cats[ui.c],km=Math.max(.3,hav(PL[ui.o],PL[ui.d])*1.3),k=Math.round(km*10)/10;
const ref=Math.round((S.cfg.base_fare*c.base_multiplier+k*c.per_km)/100)*100;return{km:k,min:Math.max(4,Math.ceil(km/(ui.c==='moto'?30:24)*60)),ref,lo:Math.ceil(ref*S.cfg.min_offer_pct/100),hi:Math.floor(ref*S.cfg.max_offer_pct/100)}}
const X=p=>Math.max(5,Math.min(315,(p[1]+75.62)/.1*300+10)).toFixed(1),Y=p=>Math.max(5,Math.min(185,(6.36-p[0])/.21*170+10)).toFixed(1);
function map(o,d,v){const a=PL[o]||[6.3,-75.56],b=PL[d]||[6.25,-75.56];let g='';for(let i=1;i<8;i++)g+=`<path d="M${i*40} 0V190M0 ${i*24}H320" stroke="var(--br)"/>`;
return`<svg class="map" viewBox="0 0 320 190">${g}<path d="M${X(a)} ${Y(a)}L${X(b)} ${Y(b)}" stroke="var(--acc)" stroke-width="3" stroke-dasharray="6 4" fill="none"/><circle cx="${X(a)}" cy="${Y(a)}" r="6" fill="#12a150"/><circle cx="${X(b)}" cy="${Y(b)}" r="6" fill="#d92d3a"/><text x="${X(a)}" y="${+Y(a)-10}" font-size="9" text-anchor="middle" fill="var(--fg)">${E(o)}</text><text x="${X(b)}" y="${+Y(b)+17}" font-size="9" text-anchor="middle" fill="var(--fg)">${E(d)}</text>${v?`<circle cx="${X([v.lat,v.lng])}" cy="${Y([v.lat,v.lng])}" r="9" fill="var(--acc)" stroke="#fff" stroke-width="2"/><text x="${X([v.lat,v.lng])}" y="${+Y([v.lat,v.lng])+3.5}" font-size="10" text-anchor="middle">🚕</text>`:''}</svg>`}
const opts=(a,s,l)=>a.map(x=>`<option value="${E(x)}" ${x===s?'selected':''}>${E(l?l[x]:x)}</option>`).join('');
const catNames=()=>Object.fromEntries(Object.values(S.cats).map(c=>[c.code,c.name]));

// ===== Datos =====
async function boot(){
  S.p=await q(sb.from('profiles').select('*').eq('id',S.u.id).single());
  S.cfg=await q(sb.from('settings').select('*').single());
  S.cats=Object.fromEntries(((await q(sb.from('service_categories').select('*').eq('active',true)))||[]).map(c=>[c.code,c]));
  if(!S.ch){S.ch=sb.channel('cq');['rides','offers','driver_locations','sos_alerts'].forEach(t=>S.ch.on('postgres_changes',{event:'*',schema:'public',table:t},deb));
    S.ch.on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+S.u.id},p=>toast(p.new.title+': '+(p.new.body||'')));S.ch.subscribe()}
  geo();refresh()}
let dt;const deb=()=>{clearTimeout(dt);dt=setTimeout(refresh,300)};
async function refresh(){
  if(!S.u||!S.p)return;const u=S.u.id;
  S.d=await q(sb.from('drivers').select('*,vehicles(model,plate)').eq('user_id',u).maybeSingle())||null;
  S.rides=(await q(sb.from('rides').select('*').eq('passenger_id',u).order('created_at',{ascending:false}).limit(30)))||[];
  const rated=new Set(((await q(sb.from('ratings').select('ride_id').eq('from_user',u)))||[]).map(x=>x.ride_id));
  S.rated=rated;S.ride=S.rides.find(r=>ACT.includes(r.status)||(r.status==='completed'&&!rated.has(r.id)))||null;
  S.offers=[];S.pd=null;S.loc=null;
  if(S.ride){
    if(S.ride.status==='searching')S.offers=(await q(sb.from('offers').select('*,drivers(display_name,rating_avg,vehicles(model,plate))').eq('ride_id',S.ride.id).eq('status','pending').order('price')))||[];
    else if(S.ride.driver_id){S.pd=await q(sb.from('drivers').select('user_id,display_name,rating_avg,vehicles(model,plate)').eq('id',S.ride.driver_id).maybeSingle())||null;
      S.loc=await q(sb.from('driver_locations').select('lat,lng').eq('driver_id',S.ride.driver_id).maybeSingle())||null}}
  if(S.d){
    S.req=S.d.online&&S.d.status==='approved'?((await q(sb.from('rides').select('*').eq('status','searching').eq('category',S.d.category).order('created_at',{ascending:false})))||[]).filter(r=>r.passenger_id!==u):[];
    S.mo=(await q(sb.from('offers').select('ride_id,price').eq('driver_id',S.d.id)))||[];
    S.cur=((await q(sb.from('rides').select('*').eq('driver_id',S.d.id).in('status',['accepted','arrived','ongoing']).limit(1)))||[])[0]||null;
    S.dh=(await q(sb.from('rides').select('agreed_fare,origin_name,dest_name').eq('driver_id',S.d.id).eq('status','completed').order('completed_at',{ascending:false}).limit(30)))||[]}
  if(STAFF.includes(S.p.role))S.a={drivers:(await q(sb.from('drivers').select('*,vehicles(model,plate),driver_documents(doc_type,storage_path,status)').order('created_at',{ascending:false})))||[],
    rides:(await q(sb.from('rides').select('*').order('created_at',{ascending:false}).limit(50)))||[],pay:(await q(sb.from('payments').select('amount,commission_amount,status')))||[],sos:(await q(sb.from('sos_alerts').select('*').eq('status','open')))||[]};
  R()}
function geo(){if(!navigator.geolocation||S.gw)return;S.gw=navigator.geolocation.watchPosition(p=>{const t=Date.now();if(!S.d||!S.d.online||t-(S.gt||0)<8000)return;S.gt=t;
  m(sb.from('driver_locations').upsert({driver_id:S.d.id,lat:p.coords.latitude,lng:p.coords.longitude,heading:p.coords.heading,updated_at:new Date().toISOString()}))},()=>{},{enableHighAccuracy:true})}

// ===== Acciones =====
const A={
async auth(){const{email,pass,name}=ui;if(!email||pass.length<6)return toast('Correo y contraseña (mínimo 6 caracteres)');
  if(ui.mode==='in'){const{error}=await sb.auth.signInWithPassword({email,password:pass});if(error)toast(error.message)}
  else{const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});if(error)toast(error.message);else if(!data.session)toast('Cuenta creada. Revisa tu correo para confirmarla y luego ingresa.')}},
async out(){await sb.auth.signOut()},
async req(){const c=calc(),pr=ui.pr??c.ref;if(ui.o===ui.d)return toast('El origen y el destino deben ser distintos');
  if(pr<c.lo||pr>c.hi)return toast(`Tu oferta debe estar entre ${$c(c.lo)} y ${$c(c.hi)}`);
  const[a,b]=[PL[ui.o],PL[ui.d]];if(await m(sb.from('rides').insert({passenger_id:S.u.id,category:ui.c,origin_name:ui.o,origin_lat:a[0],origin_lng:a[1],dest_name:ui.d,dest_lat:b[0],dest_lng:b[1],offered_fare:pr,payment_method:ui.pay}))){ui.pr=null;refresh()}},
step(n){ui.pr=Math.max(500,(ui.pr??calc().ref)+n);R()},
async accept(id){if((await sb.rpc('accept_offer',{p_offer:id})).error)toast('La oferta ya no está disponible');refresh()},
async cancel(id){const{error}=await sb.rpc('cancel_ride',{p_ride:id});if(error)toast(error.message);refresh()},
async rate(n){if(S.pd&&await m(sb.from('ratings').insert({ride_id:S.ride.id,from_user:S.u.id,to_user:S.pd.user_id,stars:n})))refresh()},
async sos(){if(await m(sb.from('sos_alerts').insert({ride_id:S.ride?.id,user_id:S.u.id})))toast('Alerta enviada al centro de operaciones')},
async reg(){const{rn,rc,rm,rp}=ui;if(!rn.trim()||!rm.trim()||!rp.trim())return toast('Completa nombre, vehículo y placa');
  const d=await q(sb.from('drivers').insert({user_id:S.u.id,display_name:rn.trim(),category:rc}).select().single());if(!d)return;
  if(await m(sb.from('vehicles').insert({driver_id:d.id,model:rm.trim(),plate:rp.trim().toUpperCase(),color:ui.rcol||null})))toast('Registro enviado. Sube tus documentos y espera la aprobación.');refresh()},
async upDoc(){const f=document.getElementById('df').files[0];if(!f)return toast('Elige un archivo');const path=`${S.u.id}/${ui.dt}-${Date.now()}-${f.name.replace(/[^\w.-]/g,'_')}`;
  if(!await m(sb.storage.from('driver-docs').upload(path,f)))return;if(await m(sb.from('driver_documents').insert({driver_id:S.d.id,doc_type:ui.dt,storage_path:path})))toast('Documento enviado');refresh()},
async online(){if(await m(sb.from('drivers').update({online:!S.d.online}).eq('id',S.d.id)))refresh()},
async offer(rid,p,eta){if(await m(sb.from('offers').insert({ride_id:rid,driver_id:S.d.id,price:Math.round(p/100)*100,eta_minutes:eta||ui.eta||5})))refresh()},
counter(rid){A.offer(rid,+document.getElementById('c'+rid).value)},
hide(rid){S.hid.push(rid);R()},
async next(id){const{error}=await sb.rpc('advance_ride',{p_ride:id});if(error)toast(error.message);refresh()},
async dst(id,st){if(await m(sb.from('drivers').update({status:st}).eq('id',id)))refresh()},
async doc(path){const{data}=await sb.storage.from('driver-docs').createSignedUrl(path,120);if(data)window.open(data.signedUrl,'_blank')},
async cfg(k,v){v=+v;if(v>0&&await m(sb.from('settings').update({[k]:v}).eq('id',1))){S.cfg[k]=v;toast('Configuración guardada');refresh()}},
async solve(id){if(await m(sb.from('sos_alerts').update({status:'resolved'}).eq('id',id)))refresh()}};

// ===== Vistas =====
function authV(){const up=ui.mode==='up';return`<div class="top"><div class="logo">📍 CERQUITA</div></div><div class="card"><h3>${up?'Crear cuenta':'Ingresar'}</h3><div class="row">${up?`<input class="full" placeholder="Nombre completo" value="${E(ui.name)}" oninput="ui.name=this.value">`:''}<input class="full" type="email" placeholder="Correo" value="${E(ui.email)}" oninput="ui.email=this.value"><input class="full" type="password" placeholder="Contraseña" oninput="ui.pass=this.value"></div><div class="row" style="margin-top:10px"><button class="b" onclick="A.auth()">${up?'Registrarme':'Entrar'}</button><button class="b g" onclick="ui.mode='${up?'in':'up'}';R()">${up?'Ya tengo cuenta':'Crear cuenta'}</button></div></div>`}
function form(){const c=calc(),pr=ui.pr??c.ref;
return map(ui.o,ui.d)+`<div class="card"><h3>¿A dónde vas?</h3><div class="row"><select class="full" onchange="ui.o=this.value;ui.pr=null;R()">${opts(Object.keys(PL),ui.o)}</select><select class="full" onchange="ui.d=this.value;ui.pr=null;R()">${opts(Object.keys(PL),ui.d)}</select></div>
<div class="row" style="margin:10px 0">${Object.values(S.cats).map(k=>`<button class="chip ${k.code===ui.c?'on':''}" onclick="ui.c='${k.code}';ui.pr=null;R()">${E(k.name.replace('CERQUITA ',''))}</button>`).join('')}</div>
<div class="mut">${c.km} km · ~${c.min} min · Referencia ${$c(c.ref)} (puedes ofertar entre ${$c(c.lo)} y ${$c(c.hi)})</div>
<div class="row" style="margin:10px 0"><button class="b g" onclick="A.step(-500)">−</button><div class="price">${$c(pr)}</div><button class="b g" onclick="A.step(500)">+</button></div>
<div class="row"><select onchange="ui.pay=this.value">${opts(['efectivo','transferencia','billetera'],ui.pay,{efectivo:'Efectivo',transferencia:'Transferencia',billetera:'Billetera digital'})}</select></div>
<button class="b full" style="margin-top:10px" onclick="A.req()">Proponer mi precio</button></div>`}
function hist(){const h=S.rides.filter(r=>r.status==='completed'&&S.rated?.has(r.id));return h.length?`<div class="card"><h3>Historial</h3>${h.map(r=>`<div class="row"><span>${E(r.origin_name)} → ${E(r.dest_name)}</span><b class="sp">${$c(r.agreed_fare)}</b></div>`).join('')}</div>`:''}
function pas(){const r=S.ride;if(!r)return form()+hist();let b='';const v=S.pd?.vehicles?.[0];
if(r.status==='searching')b=`<h3>Ofertas recibidas (${S.offers.length}/${S.cfg.max_offers})</h3><div class="mut">Tu precio ${$c(r.offered_fare)} · referencia ${$c(r.reference_fare)}</div>`+(S.offers.map(o=>`<div class="off"><div><b>${E(o.drivers?.display_name)}</b> ★ ${o.drivers?.rating_avg}<div class="mut">${E(o.drivers?.vehicles?.[0]?.model)} · llega en ${o.eta_minutes} min</div></div><b class="sp">${$c(o.price)}</b><button class="b s" onclick="A.accept('${o.id}')">Aceptar</button></div>`).join('')||'<p class="mut">Esperando conductores cercanos…</p>')+`<button class="b g s" onclick="A.cancel('${r.id}')">Cancelar solicitud</button>`;
else if(r.status==='completed')b=`<h3>Llegaste a tu destino</h3><p>Total: <b>${$c(r.agreed_fare)}</b> · ${E(r.payment_method)}</p><div class="row">${[1,2,3,4,5].map(n=>`<button class="chip" onclick="A.rate(${n})">${n} ★</button>`).join('')}</div><p class="mut">Califica a ${E(S.pd?.display_name)}</p>`;
else b=`<h3>${ST[r.status]}</h3><p><b>${E(S.pd?.display_name)}</b> ★ ${S.pd?.rating_avg??''} · ${E(v?.model)} · ${E(v?.plate)}</p><p class="mut">Tarifa acordada ${$c(r.agreed_fare)} · ${E(r.payment_method)}</p><div class="row"><button class="b r s" onclick="A.sos()">🆘 Emergencia</button>${r.status==='accepted'?`<button class="b g s" onclick="A.cancel('${r.id}')">Cancelar</button>`:''}</div>`;
return map(r.origin_name,r.dest_name,S.loc)+`<div class="card">${b}</div>`+hist()}
function dri(){const d=S.d;
const reg=`<div class="card"><h3>Registrarme como conductor</h3><div class="row"><input placeholder="Nombre completo" value="${E(ui.rn)}" oninput="ui.rn=this.value"><select onchange="ui.rc=this.value">${opts(Object.keys(S.cats),ui.rc,catNames())}</select><input placeholder="Vehículo (marca y modelo)" value="${E(ui.rm)}" oninput="ui.rm=this.value"><input placeholder="Placa" value="${E(ui.rp)}" oninput="ui.rp=this.value"><input placeholder="Color" value="${E(ui.rcol)}" oninput="ui.rcol=this.value"></div><button class="b" style="margin-top:10px" onclick="A.reg()">Enviar registro</button></div>`;
if(!d)return reg;
const docs=`<div class="card"><h3>Documentos</h3><div class="row"><select onchange="ui.dt=this.value">${opts(['cedula','licencia','soat','tecnomecanica','tarjeta_propiedad','foto'],ui.dt)}</select><input type="file" id="df" accept="image/*,application/pdf"><button class="b s" onclick="A.upDoc()">Subir</button></div></div>`;
if(d.status!=='approved')return`<div class="card"><h3>${E(d.display_name)}</h3><p>Estado de tu cuenta: <b>${{pending:'pendiente de aprobación',rejected:'rechazada',suspended:'suspendida'}[d.status]}</b>. Un administrador debe revisar tus documentos.</p></div>`+(d.status==='pending'?docs:'');
const gross=S.dh.reduce((a,r)=>a+r.agreed_fare,0),net=gross*(1-S.cfg.commission_pct/100),v=d.vehicles?.[0];
let h=`<div class="k"><div><span class="mut">Ganancias netas</span><b>${$c(net)}</b></div><div><span class="mut">Servicios</span><b>${S.dh.length}</b></div><div><span class="mut">Calificación</span><b>★ ${d.rating_avg}</b></div></div><div class="card row"><b>${E(v?.model)} · ${E(v?.plate)}</b><span class="tag">${E(S.cats[d.category]?.name)}</span><button class="b s sp ${d.online?'r':''}" onclick="A.online()">${d.online?'Desconectarme':'Conectarme'}</button></div>`;
if(S.cur){const c=S.cur;return h+map(c.origin_name,c.dest_name)+`<div class="card"><h3>${ST[c.status]}</h3><p>${E(c.passenger_name)} · ${E(c.origin_name)} → ${E(c.dest_name)} · ${c.distance_km} km</p><p>Tarifa acordada <b>${$c(c.agreed_fare)}</b> (neto ${$c(c.agreed_fare*(1-S.cfg.commission_pct/100))}) · ${E(c.payment_method)}</p><button class="b full" onclick="A.next('${c.id}')">${{accepted:'Confirmar llegada',arrived:'Iniciar viaje',ongoing:'Finalizar viaje'}[c.status]}</button></div>`}
if(!d.online)return h+'<p class="mut">Conéctate para recibir solicitudes cercanas.</p>';
const q2=S.req.filter(r=>!S.hid.includes(r.id));
return h+(q2.map(r=>{const o=S.mo.find(x=>x.ride_id===r.id);return`<div class="card"><div class="row"><b>${E(r.origin_name)} → ${E(r.dest_name)}</b><b class="sp">${$c(r.offered_fare)}</b></div><div class="mut">${r.distance_km} km · ~${r.est_minutes} min · Referencia ${$c(r.reference_fare)}</div>${o?`<p class="mut">Oferta enviada por ${$c(o.price)}. Esperando al pasajero…</p>`:`<div class="row" style="margin-top:8px"><button class="b s" onclick="A.offer('${r.id}',${r.offered_fare})">Aceptar ${$c(r.offered_fare)}</button><input id="c${r.id}" type="number" step="100" placeholder="Contraoferta" style="width:120px"><button class="b g s" onclick="A.counter('${r.id}')">Contraofertar</button><button class="b g s sp" onclick="A.hide('${r.id}')">Rechazar</button></div>`}</div>`}).join('')||'<p class="mut">Sin solicitudes por ahora. Se actualizan en tiempo real.</p>')+docs}
function adm(){const a=S.a,c=S.cfg,done=a.rides.filter(r=>r.status==='completed'),g=done.reduce((x,r)=>x+r.agreed_fare,0),com=a.pay.filter(p=>p.status!=='cancelled').reduce((x,p)=>x+p.commission_amount,0);
const T={drivers:`<div class="tbl"><table><tr><th>Conductor</th><th>Categoría</th><th>Vehículo</th><th>Documentos</th><th>Estado</th><th></th></tr>${a.drivers.map(d=>`<tr><td>${E(d.display_name)}</td><td>${E(d.category)}</td><td>${E(d.vehicles?.[0]?.model)} ${E(d.vehicles?.[0]?.plate)}</td><td>${(d.driver_documents||[]).map(x=>`<a href="#" onclick="A.doc('${E(x.storage_path)}');return false">${x.doc_type}</a>`).join(', ')||'—'}</td><td>${d.status}</td><td>${d.status==='approved'?`<button class="b g s" onclick="A.dst('${d.id}','suspended')">Suspender</button>`:`<button class="b s" onclick="A.dst('${d.id}','approved')">Aprobar</button> <button class="b g s" onclick="A.dst('${d.id}','rejected')">Rechazar</button>`}</td></tr>`).join('')||'<tr><td>Sin conductores</td></tr>'}</table></div>`,
rides:`<div class="tbl"><table><tr><th>Fecha</th><th>Ruta</th><th>Oferta</th><th>Acordado</th><th>Estado</th></tr>${a.rides.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString('es-CO')}</td><td>${E(r.origin_name)} → ${E(r.dest_name)}</td><td>${$c(r.offered_fare)}</td><td>${r.agreed_fare?$c(r.agreed_fare):'—'}</td><td>${ST[r.status]}</td></tr>`).join('')||'<tr><td>Sin viajes</td></tr>'}</table></div>`,
cfg:`<div class="row">${[['commission_pct','Comisión %'],['base_fare','Tarifa base $'],['min_offer_pct','Oferta mínima % de ref.'],['max_offer_pct','Oferta máxima % de ref.'],['max_offers','Máx. ofertas por viaje']].map(([k,l])=>`<label class="mut">${l}<br><input type="number" value="${c[k]}" onchange="A.cfg('${k}',this.value)" style="width:130px"></label>`).join('')}</div><p class="mut">Solo el rol administrador puede guardar cambios; se aplican a los nuevos viajes y ofertas.</p>`,
sos:a.sos.map(s=>`<div class="row card"><b>🆘 Alerta</b><span class="mut">${new Date(s.created_at).toLocaleTimeString('es-CO')} · viaje ${E(String(s.ride_id||'—').slice(0,8))}</span><button class="b s sp" onclick="A.solve('${s.id}')">Marcar atendida</button></div>`).join('')||'<p class="mut">Sin alertas abiertas.</p>'};
return`<div class="k"><div><span class="mut">Viajes activos</span><b>${a.rides.filter(r=>ACT.includes(r.status)).length}</b></div><div><span class="mut">Finalizados</span><b>${done.length}</b></div><div><span class="mut">Ingresos brutos</span><b>${$c(g)}</b></div><div><span class="mut">Comisión</span><b>${$c(com)}</b></div><div><span class="mut">SOS abiertas</span><b>${a.sos.length}</b></div></div>
<div class="tabs row" style="margin-bottom:10px">${[['drivers','Conductores'],['rides','Viajes'],['cfg','Tarifas y comisiones'],['sos','Alertas SOS']].map(([k,l])=>`<button class="${ui.tab===k?'on':''}" onclick="ui.tab='${k}';R()">${l}</button>`).join('')}</div><div class="card">${T[ui.tab]}</div>`}
function R(){
  const ae=document.activeElement;if(ae&&['INPUT','SELECT','TEXTAREA'].includes(ae.tagName)&&document.getElementById('app').contains(ae)&&S.u){pend=true;return}
  pend=false;const app=document.getElementById('app');
  if(!S.u||!S.p){app.innerHTML=S.u?'<p class="mut">Cargando…</p>':authV();return}
  const staff=STAFF.includes(S.p.role);if(ui.role==='a'&&!staff)ui.role='p';
  document.documentElement.style.setProperty('--acc',COL[ui.role]);
  const tabs=[['p','Pasajero'],['d','Conductor']].concat(staff?[['a','Administración']]:[]);
  app.innerHTML=`<div class="top"><div class="logo">📍 CERQUITA</div><div class="tabs row">${tabs.map(([k,l])=>`<button class="${ui.role===k?'on':''}" onclick="ui.role='${k}';R()">${l}</button>`).join('')}<button onclick="A.out()">Salir</button></div></div>`+
  (S.cfg?{p:pas,d:dri,a:()=>S.a?adm():''}[ui.role]():'');}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pend)R()},50));
setInterval(()=>{if(S.u&&S.ride&&['accepted','ongoing'].includes(S.ride.status))refresh()},10000);
sb.auth.onAuthStateChange((ev,s)=>{S.u=s?.user||null;if(S.u)setTimeout(boot,0);else{S.p=null;S.d=null;R()}});
R();
</script></body></html>
